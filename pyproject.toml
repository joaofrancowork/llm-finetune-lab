[project]
name = "llm-finetune-lab"
version = "0.1.0"
description = "LoRA fine-tuning of a small open LLM (Qwen2.5-0.5B-Instruct) for intent classification on banking77, with a reproducible before/after evaluation against zero-shot and a classical baseline."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Franco" }]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.25",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
train = ["accelerate>=1.0", "peft>=0.13", "torch>=2.5", "transformers>=4.46"]

[project.scripts]
ft-lab = "finetune_lab.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pandas-stubs>=2.2", "pre-commit>=3.8", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=finetune_lab --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/finetune_lab/train.py", "src/finetune_lab/generate.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
